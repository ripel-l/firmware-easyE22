name: Setup Build Variant Composite Action
description: Variant build actions for Meshtastic PlatformIO steps
author: meshtastic

inputs:
  pio_platform:
    description: The PlatformIO platform to build (esp32, nrf52, portduino, rp2xx0, stm32wl)
    required: true
  pio_env:
    description: The PlatformIO environment to build
    required: true
  pio_target:
    description: The PlatformIO run target (default is 'build')
    required: false
    default: build
  # Deprecated
  ota_firmware_source:
    description: Deprecated - The source binary for OTA firmware
    required: false
    default: ""
  # Deprecated
  ota_firmware_target:
    description: Deprecated - The target binary for OTA firmware
    required: false
    default: ""
  pio_token:
    description: PlatformIO token - Use to help with rate-limiting issues on PlatformIO's registry (optional)
    required: false
    default: ""
  meshtastic_branch:
    description: The Meshtastic branch (container) to use for the build.
    required: false
    default: develop

runs:
  using: composite
  steps:
    - id: build_meshtastic
      shell: bash
      run: |
        set -euo pipefail

        IMAGE_TAG="local/gh-action-firmware:${MT_PLATFORM}"

        echo "::group::Build local gh-action-firmware image"

        docker build \
          --build-arg PIO_PLATFORM="${MT_PLATFORM}" \
          --build-arg DEPS_FROM_REPO="https://github.com/${GITHUB_REPOSITORY}.git" \
          --build-arg DEPS_FROM_REF="${GITHUB_REF_NAME}" \
          -f "${GITHUB_ACTION_PATH}/Containerfile" \
          -t "${IMAGE_TAG}" \
          "${GITHUB_ACTION_PATH}"

        echo "::endgroup::"

        echo "::group::Run gh-action-firmware"

        docker run --rm \
          --env GITHUB_ACTIONS \
          --env XDG_CACHE_HOME \
          --env PLATFORMIO_BUILD_DIR \
          --env MT_ENV \
          --env MT_PLATFORM \
          --env MT_TARGET \
          --env MT_VERBOSE \
          --env PIO_TOKEN \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          "${IMAGE_TAG}"

        echo "::endgroup::"
      env:
        MT_PLATFORM: ${{ inputs.pio_platform }}
        MT_ENV: ${{ inputs.pio_env }}
        MT_TARGET: ${{ inputs.pio_target }}
        MT_VERBOSE: ${{ runner.debug || 0 }}
        PIO_TOKEN: ${{ inputs.pio_token }}
