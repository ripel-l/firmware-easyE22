[env:ESP32-S3_mini_nano_E22P]
extends = esp32s3_base
; Використовуємо борд-конфіг для ініціалізації 16MB Flash та Octal PSRAM (R8)
board = esp32-s3-devkitc-1-n16r8v
board_level = extra
build_flags =
  ${esp32s3_base.build_flags}
  -D ESP32-S3_mini_nano_E22P          
  -I variants/esp32s3/ESP32-S3_mini_nano_E22P ; Шлях до вашої папки з variant.h
  -D CONFIG_SPIRAM_SUPPORT=1
  -D BOARD_HAS_PSRAM
