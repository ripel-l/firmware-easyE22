[env:ESP32_S3_mini_nano_E22P]
extends = esp32s3_base
; Використовуємо борд-конфіг для ініціалізації 16MB Flash та Octal PSRAM (R8)
board = ESP32_S3_mini_nano_E22P
board_build.partitions = large_spiffs_16MB.csv
board_level = extra
build_flags =
  ${esp32s3_base.build_flags}
  -D ESP32_S3_mini_nano_E22P          
  -I variants/esp32s3/ESP32_S3_mini_nano_E22P ; Шлях до вашої папки з variant.h
